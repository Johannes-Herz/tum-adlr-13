[project]
name = "tactile-exploration-of-objects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johannes-Herz", email = "herz.johannes@gmx.net" },
    { name = "Tobias Witteler", email = "tobias-witteler@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[project.scripts]
tactex = "tactex.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tactex"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
