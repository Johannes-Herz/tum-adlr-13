[project]
name = "tactile-exploration-of-objects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johannes-Herz", email = "herz.johannes@gmx.net" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
tactex = "tactex.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tactex"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
