dataset:
  source: shapenet
  # category: "03797390"
  categories: ["03797390", "04225987"]
  resolution: 64
  version: v001




run_name: unet_037397390
epochs: 70
batch_size: 64
learning_rate: 0.001
widths: [32, 64, 128, 256]
kernel_size: 3
max_rays: 40  # Inclusive; partial observations are generated online
